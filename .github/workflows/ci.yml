name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # The process runtime leans on POSIX semantics, so macOS is a real
          # target rather than an afterthought.
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Test
        run: pytest -q

  ui:
    name: dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - run: npm --prefix ui run typecheck
      - run: npm --prefix ui run build
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: src/swarmdeck/ui
          retention-days: 7

  scale:
    name: scale smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: 1000 agents at concurrency 200
        # Guards the claim on the tin. A regression that caps concurrency or
        # leaks file descriptors fails here rather than in someone's run.
        run: |
          cat > scale.swarm.yaml <<'EOF'
          name: ci-scale
          concurrency: 200
          command: ["python3", "-c", "import random,time; time.sleep(random.uniform(0.1,0.4))"]
          timeout: 60
          tasks:
            count: 1000
          EOF
          swarmdeck run scale.swarm.yaml --quiet
          python - <<'EOF'
          import json, pathlib
          results = sorted(pathlib.Path(".swarmdeck/runs").glob("*/results.jsonl"))[-1]
          rows = [json.loads(line) for line in results.read_text().splitlines()]
          ok = sum(r["status"] == "succeeded" for r in rows)
          print(f"{ok}/{len(rows)} succeeded")
          assert len(rows) == 1000, f"expected 1000 agents, got {len(rows)}"
          assert ok == 1000, f"only {ok} succeeded"
          EOF

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks CLI is MIT-licensed and free; only the Action wrapper
      # requires a paid licence for organisation repos.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan history
        run: gitleaks detect --redact --verbose --no-banner

  build:
    name: wheel
    runs-on: ubuntu-latest
    needs: [python, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm --prefix ui ci && npm --prefix ui run build
      - run: pip install build && python -m build
      - name: The wheel must ship a working dashboard
        run: |
          python -m zipfile -l dist/*.whl | grep -q "swarmdeck/ui/index.html"
          python -m zipfile -l dist/*.whl | grep -q "swarmdeck/examples/demo_worker.py"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
