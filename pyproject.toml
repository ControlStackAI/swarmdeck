[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swarmdeck"
version = "0.1.0"
description = "Launch, control, and visualize agent process swarms."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "agents",
    "multi-agent",
    "swarm",
    "orchestration",
    "observability",
    "llm",
    "dashboard",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/ControlStackAI/swarmdeck"
Source = "https://github.com/ControlStackAI/swarmdeck"
Issues = "https://github.com/ControlStackAI/swarmdeck/issues"

[project.scripts]
swarmdeck = "swarmdeck.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/swarmdeck"]
# The built dashboard is gitignored (build artifacts do not belong in source
# history) but must still ship in the wheel, so declare it explicitly --
# hatchling otherwise honours .gitignore and silently omits it.
artifacts = ["src/swarmdeck/ui/**"]

[tool.hatch.build.targets.sdist]
include = ["src/swarmdeck", "ui/src", "ui/package.json", "tests", "README.md", "LICENSE"]
# `python -m build` builds the wheel *from the sdist*, so the dashboard has to
# survive that hop too -- otherwise the wheel silently ships without a UI and
# installing from an sdist would require Node.
artifacts = ["src/swarmdeck/ui/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:swarmdeck.*"]

[tool.ruff]
line-length = 96
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # typer uses calls in argument defaults by design
    "SIM105", # contextlib.suppress is not always clearer in hot paths
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
